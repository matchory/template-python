[project]
name = "matchory-template-python"
version = "0.1.0"
# No `readme` field yet: hatchling validates the referenced file exists even for `uv sync`, and
# README.md is created by a later task alongside the field that points at it.
description = "Matchory Python project template."
requires-python = ">=3.13"
authors = [{ name = "Matchory GmbH", email = "info@matchory.com" }]
dependencies = []

[dependency-groups]
dev = [
    "matchory-coding-style>=0.1.2",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchory_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `extend` takes a filesystem path and cannot reach inside an installed package, which is why the
# preset is copied into .matchory/ by `matchory-coding-style sync` and committed.
[tool.ruff]
extend = ".matchory/ruff.toml"

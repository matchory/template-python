repos:
  - repo: https://github.com/matchory/coding-style
    rev: v0.1.2
    hooks:
      # `sync --check` defaults to the base preset, so the selected preset has to be passed
      # explicitly or the check compares against rules this project does not use.
      - id: matchory-coding-style
        args: ["--preset", "strict"]
      - id: matchory-ruff
      - id: matchory-ruff-format
